<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>国乒赛事日历 · 每日更新</title>
  <meta name="description" content="央视直播的国乒乒乓球比赛时间表,每日自动更新,大字大按钮,老年朋友也能看清。">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    /* ============ 国乒赛事日历 · 移动端重设计 ============ */
    /* 设计语言:体育转播编辑风 —— 深海蓝主色 + 中国红强调,高对比、大字号、零动效(适老化) */

    :root {
      --page:      #eef1f5;   /* 页面底色:冷调浅灰蓝 */
      --card:      #ffffff;   /* 卡片底色 */
      --ink:       #14202c;   /* 主文字:近黑,高对比 */
      --ink-2:     #586474;   /* 次级文字 */
      --navy:      #0e2a47;   /* 主色:深海蓝 */
      --navy-2:    #1b3e63;   /* 主色 hover/分层 */
      --red:       #d62828;   /* 强调:中国红(今日/高风险) */
      --red-soft:  #fdecec;
      --green:     #0a7a3a;   /* 已结束比分 */
      --green-soft:#e7f6ed;
      --amber:     #9a5a00;   /* 风险提示文字 */
      --amber-soft:#fdf3e2;
      --line:      #d9e0e8;   /* 分隔线/边框 */
      --radius:    18px;
      --filter-h:  4.3rem;   /* 粘性筛选条总高,日期头部吸顶精确贴其下沿 */
      --shadow:    0 1px 2px rgba(14,32,43,.05), 0 10px 28px rgba(14,32,43,.07);

      --fs-title: clamp(1.5rem, 4.2vw, 1.95rem);
      --fs-clock: clamp(2.3rem, 9vw, 3.1rem);
      --fs-date:  clamp(1.3rem, 5vw, 1.6rem);
      --fs-time:  clamp(1.9rem, 7.5vw, 2.4rem);
      --fs-name:  clamp(1.35rem, 5.2vw, 1.7rem);
      --fs-info:  clamp(.85rem, 3vw, .98rem);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { font-size: 18px; -webkit-text-size-adjust: 100%; }
    @media (min-width: 600px) { html { font-size: 19px; } }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      background: var(--page);
      color: var(--ink);
      line-height: 1.6;
      padding: 0 0 calc(env(safe-area-inset-bottom) + 2rem);
    }

    .wrap { max-width: 480px; margin: 0 auto; padding: 0 1rem; }

    /* ---------- 国籍筛选条(粘性,占顶部) ---------- */
    .filter {
      position: sticky; top: 0; z-index: 6;
      height: var(--filter-h);
      box-sizing: border-box;
      display: flex; gap: .5rem; align-items: center;
      padding: 0 .2rem;
      background: var(--page);
      border-bottom: 1px solid var(--line);
    }
    .filter__btn {
      flex: 1; min-height: 48px;
      font-family: inherit; font-size: 1.05rem; font-weight: 800;
      color: var(--navy); background: #fff;
      border: 2px solid var(--line); border-radius: 2rem;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .filter__btn.is-active { background: var(--navy); color: #fff; border-color: var(--navy); }
    .filter__btn:active { opacity: .85; }

    /* ---------- 顶部品牌带(深海蓝) ---------- */
    .top {
      background: var(--navy);
      color: #fff;
      text-align: center;
      padding: 1.6rem 1rem 1.3rem;
      border-bottom: 4px solid var(--red);
    }
    .top__brand {
      font-size: var(--fs-title);
      font-weight: 800;
      letter-spacing: .02em;
    }
    .top__brand::after {
      content: "";
      display: block;
      width: 46px; height: 3px;
      background: var(--red);
      margin: .5rem auto 0;
      border-radius: 2px;
    }
    .top__clock {
      margin-top: .8rem;
      font-size: var(--fs-clock);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em;
      line-height: 1.1;
    }
    .top__dated { margin-top: .25rem; font-size: 1rem; color: rgba(255,255,255,.78); }
    .top__updated { margin-top: .5rem; font-size: .82rem; color: rgba(255,255,255,.62); }
    .top__updated strong { color: #fff; font-weight: 700; }

    /* ---------- 日期卡片 ---------- */
    /* 注意:不能设 overflow:hidden,否则内部 .day__head 的 sticky 会被截断失效 */
    .day {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin: 1.4rem 0;
      box-shadow: var(--shadow);
    }
    .day--today { border-top: 4px solid var(--red); }
    .day--past { border-top: 4px solid #c4cdd8; }
    .day--past .day__head { background: #eef1f5; }
    /* 卡片圆角兜底:首子(日期头)左上/右上、末子(转播安排/比赛)左下/右下 */
    .day__head { border-radius: var(--radius) var(--radius) 0 0; }
    .day > :last-child { border-radius: 0 0 var(--radius) var(--radius); }

    .day__head {
      position: sticky; top: var(--filter-h);
      z-index: 4;
      display: flex; flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: .6rem;
      padding: .95rem 1.1rem;
      background: #f4f7fa;
      border-bottom: 1px solid var(--line);
      box-shadow: 0 2px 6px rgba(14,32,43,.08);
    }
    .day__when { display: flex; flex-wrap: wrap; align-items: baseline; gap: .55rem; min-width: 0; }
    .day__date { font-size: var(--fs-date); font-weight: 800; color: var(--navy); }
    .day__week { font-size: 1.05rem; color: var(--ink-2); font-weight: 600; }

    .day__tags { display: flex; flex-wrap: wrap; align-items: center; gap: .45rem; flex-shrink: 0; }
    .tag {
      font-size: .92rem; font-weight: 800;
      padding: .25rem .7rem; border-radius: 2rem; white-space: nowrap;
    }
    .tag--today { background: var(--red); color: #fff; }
    .tag--soon  { background: var(--navy); color: #fff; }
    .tag--muted { background: #e4e9ef; color: var(--ink-2); }
    .tag--past  { background: #c4cdd8; color: var(--ink-2); }

    /* 战报回顾分隔标题:细线 + 居中字,和上面今日内容明显分界 */
    .recap-sep {
      display: flex; align-items: center; gap: .8rem;
      margin: 2.2rem 0 .2rem;
      color: var(--ink-2);
      font-size: 1.05rem; font-weight: 800; letter-spacing: .1em;
    }
    .recap-sep::before, .recap-sep::after {
      content: ""; flex: 1; height: 2px; border-radius: 2px;
      background: linear-gradient(to right, transparent, var(--line) 45%, var(--line) 55%, transparent);
    }
    .recap-sep span { padding: 0 .25rem; white-space: nowrap; }

    /* ---------- 比赛卡片 ---------- */
    .match { padding: 1.05rem 1.1rem; border-bottom: 1px solid var(--line); }
    .match:last-child { border-bottom: none; }

    /* 当日「已完成」分隔:细线 + 居中「已结束」,与上方未开始比赛明显分界 */
    .match-sep {
      display: flex; align-items: center; gap: .6rem;
      margin: .4rem 0 .15rem;
      padding: 0 1.1rem;
      color: var(--ink-2);
      font-size: .95rem; font-weight: 800; letter-spacing: .12em;
    }
    .match-sep::before, .match-sep::after {
      content: ""; flex: 1; height: 1px; border-radius: 2px;
      background: var(--line);
    }
    .match-sep span { padding: 0 .5rem; white-space: nowrap; background: var(--card); }

    .match__event {
      display: block; width: fit-content; margin: 0 auto .8rem;
      max-width: 100%;
      font-size: 1rem; font-weight: 700; color: var(--navy);
      background: #eaf1f8; border: 1px solid #cdddee;
      padding: .3rem .9rem; border-radius: 2rem; text-align: center;
      word-break: break-word;
    }

    .match__bar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .5rem .7rem;
      margin-bottom: .7rem;
    }
    .match__time {
      font-size: var(--fs-time); font-weight: 800; color: var(--navy);
      font-variant-numeric: tabular-nums; line-height: 1;
    }
    .match__chan {
      font-size: .95rem; font-weight: 700; color: #fff; background: var(--navy);
      padding: .28rem .8rem; border-radius: 2rem; white-space: nowrap;
    }

    .match__players {
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; gap: .5rem;
    }
    .player { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
    .player__flag { font-size: 1.4rem; line-height: 1; }
    .player__name { font-size: var(--fs-name); font-weight: 800; color: var(--ink); margin-top: .15rem; }
    .player__meta { font-size: var(--fs-info); color: var(--ink-2); font-weight: 500; margin-top: .1rem; word-break: break-word; }
    .player__vs { font-size: 1.05rem; font-weight: 800; color: var(--red); }

    .match__result {
      margin-top: .85rem; padding: .55rem .6rem;
      font-size: 1rem; color: var(--ink);
      background: var(--green-soft); border: 1px solid #a9dcc0; border-radius: .6rem;
      text-align: center;
    }
    /* 比分表格:体育转播风,选手名 × 局分,总分列,赢家局分高亮 */
    .score-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .score-table {
      width: 100%; border-collapse: collapse; table-layout: fixed;
      font-size: .98rem; line-height: 1.2;
    }
    .score-table th, .score-table td {
      padding: .35rem .25rem; text-align: center; vertical-align: middle;
      border: 1px solid rgba(10,122,58,.25);
    }
    .score-table thead th {
      background: var(--navy); color: #fff; font-weight: 800; font-size: .85rem;
    }
    .score-table thead th:first-child { background: #1b3e63; }
    .score-table tbody td { background: #fff; color: var(--ink); font-weight: 700; }
    .score-table__player {
      text-align: left; padding-left: .5rem; font-weight: 800;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .score-table__total {
      background: rgba(10,122,58,.08) !important; color: var(--green); font-weight: 800;
    }
    .score-table__score.is-winner { color: var(--green); font-weight: 800; background: rgba(10,122,58,.06); }
    /* 进行中:红色主题 + 顶部横幅,与已结束(绿)明显区分,适老化高对比 */
    .match__result--live { background: var(--red-soft); border-color: #e6b3b3; }
    .match__live {
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .5rem;
      margin-bottom: .55rem; padding: .45rem .7rem;
      background: var(--red); color: #fff;
      font-size: 1.05rem; font-weight: 800; line-height: 1.2; text-align: center;
      border-radius: .5rem;
    }
    .score-table--live th, .score-table--live td { border-color: rgba(214,40,40,.28); }
    .score-table--live .score-table__total {
      background: rgba(214,40,40,.10) !important; color: var(--red); font-weight: 800;
    }
    .score-table--live .score-table__score.is-winner {
      color: var(--red); font-weight: 800; background: rgba(214,40,40,.07);
    }
    /* 比赛总结(已结束)/ 看点(未开始/进行中):统一便签卡,区分配色,零动效适老化 */
    .match__note {
      margin-top: .7rem;
      border-radius: .7rem;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #fff;
    }
    .note--summary { border-color: #bcd4e6; background: #eef5fb; }
    .note--watch   { border-color: #d9c7e8; background: #f5eefb; }
    .note__head {
      display: flex; align-items: center; gap: .45rem;
      padding: .5rem .8rem;
      font-size: .95rem; font-weight: 800;
      border-bottom: 1px solid rgba(14,32,43,.08);
    }
    .note--summary .note__head { background: rgba(14,42,71,.06); color: var(--navy); }
    .note--watch   .note__head { background: rgba(106,40,156,.06); color: #6a289c; }
    .note__body {
      padding: .65rem .85rem .75rem;
      font-size: 1rem; line-height: 1.62; color: var(--ink);
    }
    /* 风险提示:结构化卡片——标签式影响点 + 可视化时间轴 + 紧凑证据/数据,拒绝大段文字 */
    .match__risk {
      margin-top: .85rem;
      border-radius: .7rem;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #fff;
    }
    .risk--high { border-color: #e6b3b3; background: var(--red-soft); }
    .risk--mid  { border-color: #f0d9ad; background: var(--amber-soft); }
    .risk--low  { border-color: #a9dcc0; background: var(--green-soft); }

    .risk__head {
      display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .5rem;
      padding: .55rem .8rem;
      border-bottom: 1px solid rgba(14,32,43,.08);
    }
    .risk--high .risk__head { background: rgba(214,40,40,.08); }
    .risk--mid  .risk__head { background: rgba(154,90,0,.07); }
    .risk--low  .risk__head { background: rgba(10,122,58,.07); }

    .risk__badge {
      font-size: .92rem; font-weight: 800; color: #fff;
      padding: .22rem .65rem; border-radius: 2rem; white-space: nowrap;
      line-height: 1.2;
    }
    .risk--high .risk__badge { background: var(--red); }
    .risk--mid  .risk__badge { background: var(--amber); }
    .risk--low  .risk__badge { background: var(--green); }

    .risk__type { font-size: .9rem; font-weight: 700; color: var(--ink-2); }

    /* 影响点:短句标签流,一行一个结论 */
    .risk__impacts {
      display: flex; flex-direction: column; gap: .35rem;
      padding: .65rem .85rem .5rem;
    }
    .risk__impact {
      display: flex; align-items: flex-start; gap: .4rem;
      font-size: .98rem; line-height: 1.45; color: var(--ink);
      font-weight: 600;
    }
    .risk__impact::before {
      content: "•";
      flex-shrink: 0;
      color: var(--amber); font-weight: 800; font-size: 1.1rem; line-height: 1;
      margin-top: .05rem;
    }
    .risk--high .risk__impact::before { color: var(--red); }
    .risk--low  .risk__impact::before { color: var(--green); }

    /* 时间冲突可视化:横向时间轴,冲突段标红,直播段标绿 */
    .risk__timeline {
      display: flex; flex-wrap: wrap; align-items: center; gap: .35rem;
      padding: .45rem .85rem .55rem;
    }
    .risk__slot {
      flex: 1 1 auto; min-width: 4.2rem; max-width: 100%;
      padding: .35rem .5rem;
      background: #fff; border: 1px solid var(--line); border-radius: .55rem;
      font-size: .82rem; font-weight: 700; color: var(--ink); text-align: center;
      line-height: 1.25;
    }
    .risk__slot--block { background: #f0f2f5; color: var(--ink-2); border-color: #d9dee5; }
    .risk__slot--live { background: var(--green-soft); color: var(--green); border-color: #a9dcc0; }
    .risk__slot--cut { background: var(--red-soft); color: var(--red); border-color: #e6b3b3; }
    .risk__slot__time {
      display: block; font-size: .78rem; font-weight: 800; color: var(--navy);
      margin-bottom: .05rem;
    }

    /* 证据/数据:紧凑小字 + 双栏数据卡 */
    .risk__ev {
      display: flex; gap: .35rem; align-items: flex-start;
      padding: .45rem .85rem;
      font-size: .86rem; line-height: 1.5;
      border-top: 1px dashed rgba(14,32,43,.12);
      color: var(--ink-2);
    }
    .risk__stat {
      padding: .55rem .85rem .65rem;
      font-size: .92rem; line-height: 1.5;
      border-top: 1px dashed rgba(14,32,43,.12);
      color: var(--navy); font-weight: 600;
      background: rgba(14,42,71,.045);
    }
    .risk__stat-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: .5rem;
      margin-top: .35rem;
    }
    .risk__stat-card {
      background: #fff; border: 1px solid rgba(14,42,71,.12); border-radius: .55rem;
      padding: .45rem .5rem; text-align: center;
    }
    .risk__stat-card__label {
      font-size: .72rem; font-weight: 700; color: var(--ink-2);
      margin-bottom: .1rem;
    }
    .risk__stat-card__val {
      font-size: .95rem; font-weight: 800; color: var(--navy);
      line-height: 1.2;
    }

    /* ---------- 待公布 / 转播安排(重新设计:清爽时间卡) ---------- */
    .day__pending {
      padding: 1.25rem 1.1rem .6rem;
      text-align: center;
    }
    .pending__head {
      display: inline-flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .5rem;
      font-size: 1.15rem; font-weight: 800; color: var(--navy);
      background: #eaf1f8; border: 1px solid #cdddee;
      padding: .35rem .95rem; border-radius: 2rem; text-align: center;
    }
    .pending__note {
      margin-top: .55rem;
      font-size: .95rem; color: var(--ink-2); line-height: 1.55;
    }

    .sched { padding: .35rem .85rem .85rem; }
    .sched__row {
      display: flex; align-items: flex-start; gap: .75rem;
      margin: .55rem 0; padding: .75rem .9rem;
      background: #f7f9fb; border: 1px solid var(--line); border-radius: .85rem;
    }
    .sched__time {
      flex-shrink: 0;
      display: flex; flex-direction: column; align-items: flex-start;
      line-height: 1.15;
      min-width: 3.2rem; text-align: left;
    }
    .sched__time-start {
      font-size: 1.15rem; font-weight: 800; color: var(--navy);
      font-variant-numeric: tabular-nums;
    }
    .sched__time-end {
      font-size: .88rem; font-weight: 700; color: var(--ink-2);
      font-variant-numeric: tabular-nums;
    }
    .sched__main { min-width: 0; }
    .sched__chan {
      display: inline-block; font-size: .82rem; font-weight: 700; color: #fff;
      background: var(--navy); padding: .18rem .6rem; border-radius: 2rem; margin-bottom: .2rem;
    }
    .sched__text { font-size: .98rem; color: var(--ink); line-height: 1.5; word-break: break-word; }
    /* 待公布窗口拆成「对决」卡片:阶段 + 双方 + 状态,干净可读 */
    .sched__list { display: flex; flex-direction: column; gap: .55rem; }
    .sched__duel {
      padding: .55rem .7rem;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: .7rem;
    }
    .sched__duel-stage {
      font-size: .88rem; font-weight: 800; color: var(--navy);
      margin-bottom: .25rem; line-height: 1.2;
    }
    .sched__duel-players {
      font-size: 1rem; font-weight: 700; color: var(--ink); line-height: 1.45;
      word-break: break-word;
    }
    .sched__vs {
      display: inline-block;
      margin: 0 .35rem;
      padding: .1rem .42rem;
      font-size: .78rem; font-weight: 800; color: #fff;
      background: var(--red); border-radius: 2rem;
      vertical-align: middle; line-height: 1;
    }
    .sched__duel-status { margin-top: .35rem; }
    .sched__status {
      display: inline-block;
      font-size: .74rem; font-weight: 800;
      padding: .12rem .45rem; border-radius: 2rem;
      line-height: 1.2;
    }
    .sched__status.is-locked { background: var(--green-soft); color: var(--green); border: 1px solid #a9dcc0; }
    .sched__status.is-pending { background: #e4e9ef; color: var(--ink-2); border: 1px solid var(--line); }
    .sched__note {
      font-size: .9rem; color: var(--ink-2); line-height: 1.5;
      padding: .35rem .5rem;
      background: #f0f2f5; border-radius: .5rem;
    }
    .sched__empty {
      padding: 1rem 1.1rem 1.2rem;
      font-size: 1rem; color: var(--ink-2); text-align: center;
    }

    /* ---------- 转播安排(日底) ---------- */
    .day__broadcast {
      padding: .85rem 1.1rem 1rem;
      font-size: .95rem; color: var(--ink-2); line-height: 1.6;
      background: #f7f9fb; border-top: 1px dashed var(--line);
    }
    .day__broadcast b { color: var(--navy); }

    /* ---------- 空窗期:下一场 ---------- */
    .day--next { border-top: 4px solid var(--navy); }
    .day__next {
      padding: 1.2rem 1.1rem; text-align: center;
      font-size: 1.15rem; font-weight: 700; color: var(--ink);
    }
    .day__next strong { color: var(--navy); }

    /* ---------- 页脚 ---------- */
    footer { margin-top: 2rem; text-align: center; }
    .links { display: flex; flex-wrap: wrap; justify-content: center; gap: .6rem; }
    .links a {
      padding: .7rem 1.4rem; font-size: 1rem; font-weight: 700;
      color: #fff; background: var(--navy); text-decoration: none;
      border-radius: 2rem; min-height: 48px; line-height: 1;
      display: inline-flex; align-items: center;
    }
    .links a:active { opacity: .88; }
    .links a.secondary { background: var(--ink-2); }

    /* 加载失败 */
    .error {
      margin: 1.4rem 0; padding: 1.2rem 1rem;
      background: var(--red-soft); color: var(--red);
      border: 2px solid #e6b3b3; border-radius: var(--radius);
      font-size: 1.05rem; text-align: center;
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top__brand">🏓 国乒赛事日历</div>
    <div class="top__clock" id="clock">--:--:--</div>
    <div class="top__dated" id="clockDate">…</div>
    <div class="top__updated">数据更新于 <strong id="updatedAt">…</strong></div>
  </header>

  <div class="wrap">
    <div class="filter" id="filter">
      <button type="button" class="filter__btn is-active" data-scope="all">全部</button>
      <button type="button" class="filter__btn" data-scope="cn">国乒</button>
      <button type="button" class="filter__btn" data-scope="jpkr">日韩</button>
    </div>
    <div id="days"></div>
    <footer>
      <div class="links">
        <a href="https://sports.cctv.com/" target="_blank" rel="noopener">央视体育官网</a>
        <a href="https://www.tvmao.com/" target="_blank" rel="noopener" class="secondary">电视猫节目单</a>
      </div>
    </footer>
  </div>

  <script>
    // 适老化:纯文本渲染,无动画、无复杂交互,保证任何设备可读

    // ---- 实时时钟(本地时间,每秒跳动) ----
    function tick() {
      var now = new Date();
      var hh = String(now.getHours()).padStart(2, '0');
      var mm = String(now.getMinutes()).padStart(2, '0');
      var ss = String(now.getSeconds()).padStart(2, '0');
      var el = document.getElementById('clock');
      if (el) el.textContent = hh + ':' + mm + ':' + ss;
      var de = document.getElementById('clockDate');
      if (de) de.textContent = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' +
        '星期' + '日一二三四五六'.charAt(now.getDay());
    }
    tick();
    setInterval(tick, 1000);

    // ---- 国旗映射(国籍 → 国旗 emoji) ----
    var FLAGS = {
      '中国': '🇨🇳', '中国香港': '🇭🇰', '中国台北': '🇨🇳',
      '日本': '🇯🇵', '韩国': '🇰🇷', '朝鲜': '🇰🇵',
      '法国': '🇫🇷', '德国': '🇩🇪', '英国': '🇬🇧', '瑞典': '🇸🇪',
      '俄罗斯': '🇷🇺', '葡萄牙': '🇵🇹', '丹麦': '🇩🇰',
      '美国': '🇺🇸', '澳大利亚': '🇦🇺', '新加坡': '🇸🇬',
      '印度': '🇮🇳', '埃及': '🇪🇬', '罗马尼亚': '🇷🇴', '波兰': '🇵🇱',
      '乌克兰': '🇺🇦', '斯洛文尼亚': '🇸🇮', '奥地利': '🇦🇹', '巴西': '🇧🇷',
      '西班牙': '🇪🇸', '斯洛伐克': '🇸🇰', '匈牙利': '🇭🇺', '尼日利亚': '🇳🇬'
    };
    function flagFor(nation) {
      if (!nation) return '';
      for (var key in FLAGS) {
        if (nation.indexOf(key) !== -1) return FLAGS[key];
      }
      return '';
    }

    // 加时间戳 + no-store,绕开 GitHub Pages 的 max-age=600 缓存,保证每次打开都拿最新数据
    fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(render)
      .catch(function (err) {
        document.getElementById('updatedAt').textContent = '加载失败';
        document.getElementById('days').innerHTML =
          '<div class="error">数据加载失败(' + err.message + ')<br>请稍后刷新,或稍后再来访问。</div>';
      });

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function relativeLabel(dateStr) {
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      var d = new Date(dateStr + 'T00:00:00');
      d.setHours(0, 0, 0, 0);
      var diff = Math.round((d - today) / (1000 * 60 * 60 * 24));
      if (diff === 0) return '今天';
      if (diff === 1) return '明天';
      if (diff === 2) return '后天';
      return '';
    }

    function ordinal(n) {
      var s = ['th', 'st', 'nd', 'rd'];
      var v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    function ordinalizeInfo(info) {
      if (!info) return '';
      return esc(info).replace(/世界第(\d+)/g, function (_, n) { return ordinal(parseInt(n, 10)) + ''; });
    }

    // 解析比分字符串,返回 {homeName,homeWins,awayName,awayWins,sets:[[h,a],...]}
    function parseResult(result) {
      var s = String(result || '').trim();
      var m = s.match(/^(.+?)\s+(\d+)-(\d+)\s+(.+?)(?:[（(]([^)）]+)[)）])?$/);
      if (!m) return null;
      var homeName = m[1].trim(), awayName = m[4].trim();
      var homeWins = parseInt(m[2], 10), awayWins = parseInt(m[3], 10);
      var sets = [];
      if (m[5]) {
        m[5].split('/').forEach(function (part) {
          var nums = part.split('-');
          if (nums.length === 2) {
            var a = parseInt(nums[0], 10), b = parseInt(nums[1], 10);
            if (!isNaN(a) && !isNaN(b)) sets.push([a, b]);
          }
        });
      }
      return { homeName: homeName, homeWins: homeWins, awayName: awayName, awayWins: awayWins, sets: sets };
    }

    // 把 result 渲染成体育转播式比分表格;解析失败则回落纯文本
    function renderResult(m) {
      var p = parseResult(m.result);
      if (!p || !p.sets.length) {
        return '<div class="match__result">' + esc(m.result) + '</div>';
      }
      var out = '<div class="match__result"><div class="score-table-wrap"><table class="score-table">';
      out += '<thead><tr><th class="score-table__player"></th>';
      for (var i = 0; i < p.sets.length; i++) {
        out += '<th class="score-table__set">G' + (i + 1) + '</th>';
      }
      out += '<th class="score-table__total">总分</th></tr></thead><tbody>';
      var rows = [
        { name: p.homeName || m.playerHome, total: p.homeWins, idx: 0 },
        { name: p.awayName || m.playerAway, total: p.awayWins, idx: 1 }
      ];
      rows.forEach(function (r) {
        out += '<tr><td class="score-table__player" title="' + esc(r.name) + '">' + esc(r.name) + '</td>';
        p.sets.forEach(function (set) {
          var score = set[r.idx];
          var isWinner = score === Math.max(set[0], set[1]);
          out += '<td class="score-table__score' + (isWinner ? ' is-winner' : '') + '">' + esc(String(score)) + '</td>';
        });
        out += '<td class="score-table__total">' + esc(String(r.total)) + '</td></tr>';
      });
      out += '</tbody></table></div></div>';
      return out;
    }

    // 进行中比赛:红色横幅 + 当前比分表(复用 parseResult,配色由绿转红区分已结束)
    function renderLive(m) {
      var banner = '<div class="match__live">🔴 进行中 · 当前比分</div>';
      var p = parseResult(m.live);
      if (!p || !p.sets.length) {
        return banner + '<div class="match__result match__result--live">' + esc(m.live) + '</div>';
      }
      var out = banner + '<div class="match__result match__result--live"><div class="score-table-wrap"><table class="score-table score-table--live">';
      out += '<thead><tr><th class="score-table__player"></th>';
      for (var i = 0; i < p.sets.length; i++) {
        out += '<th class="score-table__set">G' + (i + 1) + '</th>';
      }
      out += '<th class="score-table__total">总分</th></tr></thead><tbody>';
      var rows = [
        { name: p.homeName || m.playerHome, total: p.homeWins, idx: 0 },
        { name: p.awayName || m.playerAway, total: p.awayWins, idx: 1 }
      ];
      rows.forEach(function (r) {
        out += '<td class="score-table__player" title="' + esc(r.name) + '">' + esc(r.name) + '</td>';
        p.sets.forEach(function (set) {
          var score = set[r.idx];
          var isWinner = score === Math.max(set[0], set[1]);
          out += '<td class="score-table__score' + (isWinner ? ' is-winner' : '') + '">' + esc(String(score)) + '</td>';
        });
        out += '<td class="score-table__total">' + esc(String(r.total)) + '</td></tr>';
      });
      out += '</tbody></table></div></div>';
      return out;
    }

    // 把转播窗口的冗长 content 拆成「对决」卡片,只保留阶段/双方/状态;中断/转台提示单独成注
    function renderScheduleContent(s) {
      var tournament = (s.tournament || '').trim();
      var content = String(s.content || '').trim();
      if (tournament) {
        // 去掉开头的完整赛事名(如 "WTT欧洲大满贯瑞典站...")
        if (content.indexOf(tournament) === 0) {
          content = content.slice(tournament.length).replace(/^\s*[·]\s*/, '').trim();
        }
        // 去掉开头的赛事简称(如 tournament 为 "WTT横滨冠军赛" 时去掉 "横滨冠军赛")
        var shortTournament = tournament.replace(/^(WTT|ITTF|国际乒联)\s*/, '').trim();
        if (shortTournament && content.indexOf(shortTournament) === 0) {
          content = content.slice(shortTournament.length).replace(/^\s*[·]\s*/, '').trim();
        }
      }

      var segs = content.split(/[;。]/).map(function (p) { return p.trim(); }).filter(Boolean);
      if (!segs.length) {
        return '<div class="sched__text">' + esc(content || '对阵待公布') + '</div>';
      }

      var out = '<div class="sched__list">';
      segs.forEach(function (seg) {
        var status = '';
        if (seg.indexOf('已锁定') !== -1) {
          status = '<span class="sched__status is-locked">已锁定</span>';
          seg = seg.replace(/已锁定/g, '').trim();
        }
        if (seg.indexOf('待定') !== -1) {
          status = '<span class="sched__status is-pending">待定</span>';
          seg = seg.replace(/待定/g, '').trim();
        }
        seg = seg.replace(/[;。,，]+$/, '').trim();

        var isDuel = seg.replace(/[（(].*?[）)]/g, '').indexOf('vs') !== -1;
        var isFinal = /决赛/.test(seg);
        if (isDuel || isFinal) {
          var vsIdx = seg.toLowerCase().indexOf('vs');
          var colonIdx = seg.indexOf(':');
          var stage = '', players = seg;
          // 只有 vs 前面的 ":" 才是阶段分隔(避免 18:15/19:30 这类时间里的冒号误切)
          if (vsIdx !== -1 && colonIdx !== -1 && colonIdx < vsIdx) {
            stage = seg.slice(0, colonIdx).trim();
            players = seg.slice(colonIdx + 1).trim();
          }
          // 无阶段但开头是"另一场"时,把它提作小标题
          if (!stage && players.indexOf('另一场') === 0) {
            stage = '另一场';
            players = players.slice(3).replace(/^\s*/, '');
          }
          players = esc(players).replace(/\b(vs|VS|Vs)\b/g, '<span class="sched__vs">$1</span>');
          out += '<div class="sched__duel">';
          if (stage) out += '<div class="sched__duel-stage">' + esc(stage) + '</div>';
          out += '<div class="sched__duel-players">' + players + '</div>';
          if (status) out += '<div class="sched__duel-status">' + status + '</div>';
          out += '</div>';
        } else {
          out += '<div class="sched__note">' + esc(seg) + '</div>';
        }
      });
      out += '</div>';
      return out;
    }

    // 从风险正文里提取时间冲突,生成可视化时间轴;同时返回被消耗掉的时间描述,避免在影响点里重复
    function extractTimeline(body) {
      if (!body) return { slots: [], consumed: [] };
      var slots = [], consumed = [];
      var pos = 0;
      // 辅助:抓节目名(《》优先,否则 2~6 个汉字),去掉末尾语气词
      function grabProgram(after) {
        var book = after.match(/^《([^》]+)》/);
        if (book) return { text: book[1], len: book[0].length };
        var plain = after.match(/^[\u4e00-\u9fa5]{2,8}/);
        if (plain) return { text: plain[0].replace(/[了呢吧啊]+$/g, ''), len: plain[0].length };
        return null;
      }
      // 1) 连续时段 HH:MM-HH:MM
      var rangeRe = /(\d{1,2}:\d{2})-(\d{1,2}:\d{2})/g;
      body.replace(rangeRe, function (m, a, b) {
        var idx = body.indexOf(m, pos);
        pos = idx + m.length;
        var after = body.slice(pos);
        var prog = grabProgram(after.replace(/^(?:固定|连续|全程)?(?:播|转)?/, ''));
        var text = prog ? prog.text : '其他节目';
        slots.push({ type: 'block', start: a, end: b, text: text });
        // 把包含该时段的整句标为已消耗(从句首到节目名后)
        var sentStart = Math.max(0, body.lastIndexOf('，', idx) + 1, body.lastIndexOf(',', idx) + 1, body.lastIndexOf('；', idx) + 1, body.lastIndexOf(';', idx) + 1);
        var sentEnd = prog ? (pos + prog.len) : (pos + 8);
        consumed.push({ start: sentStart, end: Math.min(sentEnd, body.length) });
        return m;
      });
      // 2) 单独时间点 HH:MM
      var seen = {};
      slots.forEach(function (sl) { seen[sl.start] = 1; if (sl.end) seen[sl.end] = 1; });
      var pointRe = /(\d{1,2}:\d{2})(?!\s*-)/g;
      var match;
      while ((match = pointRe.exec(body)) !== null) {
        var t = match[1], idx = match.index;
        if (seen[t]) continue;
        var after = body.slice(idx + t.length);
        var isCut = /(?:^|\s).{0,10}?(?:转|切|换成|播|固定播)/.test(after.slice(0, 24));
        var isStart = /(?:开打|开赛|开始)/.test(after.slice(0, 16));
        var type = isCut ? 'cut' : (isStart ? 'live' : 'block');
        var text = '其他节目';
        if (type === 'live') {
          text = '开赛';
        } else {
          // 从"转/播/切/换成"之后开始抓节目名,避免把时间后面的"央视5"误当节目
          var cutMatch = after.match(/(?:转|切|换成|播|固定播)\s*/);
          var startFrom = cutMatch ? after.slice(cutMatch.index + cutMatch[0].length) : after;
          var cleaned = startFrom.replace(/^(?:\s*(?:晚上|下午|上午))?\s*(?:就|将|会)?\s*/, '');
          var prog = grabProgram(cleaned);
          if (prog) text = prog.text;
        }
        slots.push({ type: type, start: t, end: '', text: text });
        // 消耗该时间所在的短句
        var sentStart = Math.max(0, body.lastIndexOf('，', idx) + 1, body.lastIndexOf(',', idx) + 1, body.lastIndexOf('；', idx) + 1, body.lastIndexOf(';', idx) + 1);
        var sentEnd = idx + t.length + 12;
        consumed.push({ start: sentStart, end: Math.min(sentEnd, body.length) });
      }
      slots.sort(function (a, b) { return a.start.localeCompare(b.start); });
      return { slots: slots, consumed: consumed };
    }

    // 把数据段拆成选手对比卡片,如 "A(...)对B(...)" 或 "A(...) vs B(...)"
    function renderStatCards(stat) {
      var s = esc(stat).replace(/^📊\s*/, '');
      var m = s.match(/^(.+?)\((.+?)\)\s*(?:对|vs|VS)\s*(.+?)\((.+?)\)(.*)$/);
      if (!m) return '<div class="risk__stat">' + s + '</div>';
      var rest = m[5].trim().replace(/^[，,。；;]+/, '');
      var cards = [
        { name: m[1].trim(), info: m[2].trim() },
        { name: m[3].trim(), info: m[4].trim() }
      ];
      var out = '<div class="risk__stat">📊 交手数据' +
                '<div class="risk__stat-grid">';
      cards.forEach(function (c) {
        out += '<div class="risk__stat-card">' +
                 '<div class="risk__stat-card__label">' + c.name + '</div>' +
                 '<div class="risk__stat-card__val">' + c.info + '</div>' +
               '</div>';
      });
      out += '</div>';
      if (rest) out += '<div style="margin-top:.4rem;font-size:.88rem;color:var(--ink);">' + rest + '</div>';
      out += '</div>';
      return out;
    }

    // 把风险说明字符串拆成结构化卡片:徽章/标题 + 影响点标签 + 时间轴 + 证据小注 + 数据卡片
    // 数据源约定:🔴/✅/⚠️ 开头为严重级别,(类型)为可选括号标注;
    // 正文中 ⚠️ 引导证据可靠性提示,📊 引导交手数据(后者恒在末尾)
    function renderRisk(risk) {
      if (!risk) return '';
      var s = String(risk).trim();
      var sev = { emoji: '', label: '风险提示', type: '', cls: 'risk--mid' };
      var m = s.match(/^(🔴|✅|⚠️)\s*(高风险|低风险|中风险)(?:\(([^)]+)\))?[:：]/);
      if (m) {
        sev.emoji = m[1]; sev.label = m[2]; sev.type = m[3] || '';
        sev.cls = m[1] === '🔴' ? 'risk--high' : (m[1] === '✅' ? 'risk--low' : 'risk--mid');
        s = s.slice(m[0].length).trim();
      }
      var stat = '', evidence = '', body = s;
      var statIdx = s.lastIndexOf('📊');
      if (statIdx !== -1) { stat = s.slice(statIdx).trim(); body = s.slice(0, statIdx).trim(); }
      var evIdx = body.indexOf('⚠️');
      if (evIdx !== -1) { evidence = body.slice(evIdx).trim(); body = body.slice(0, evIdx).trim(); }

      // 影响点:按短句切分;已被时间轴消耗的时间描述句不再重复列出
      var tl = extractTimeline(body);
      function isConsumed(p) {
        // 若短句含 HH:MM 且基本为时间描述,认为已被时间轴覆盖
        if (/\d{1,2}:\d{2}/.test(p)) return true;
        // 若短句完全落在 consumed 区间内
        var start = body.indexOf(p);
        if (start === -1) return false;
        var end = start + p.length;
        return tl.consumed.some(function (r) { return r.start <= start && r.end >= end; });
      }
      var impacts = [];
      body.split(/[,，;；。]/).map(function (p) { return p.trim(); }).filter(Boolean).forEach(function (p) {
        if (p.length > 2 && !isConsumed(p)) impacts.push(p);
      });

      var out = '<div class="match__risk ' + sev.cls + '">';
      out += '<div class="risk__head">';
      out += '<span class="risk__badge">' + esc((sev.emoji ? sev.emoji + ' ' : '') + sev.label) + '</span>';
      if (sev.type) out += '<span class="risk__type">' + esc(sev.type) + '</span>';
      out += '</div>';

      if (impacts.length) {
        out += '<div class="risk__impacts">';
        impacts.forEach(function (p) { out += '<div class="risk__impact">' + esc(p) + '</div>'; });
        out += '</div>';
      }

      if (tl.slots.length) {
        out += '<div class="risk__timeline">';
        tl.slots.forEach(function (sl) {
          var cls = 'risk__slot';
          if (sl.type === 'live') cls += ' risk__slot--live';
          else if (sl.type === 'cut') cls += ' risk__slot--cut';
          else cls += ' risk__slot--block';
          var time = sl.end ? sl.start + '-' + sl.end : sl.start;
          out += '<div class="' + cls + '"><span class="risk__slot__time">' + time + '</span>' + esc(sl.text) + '</div>';
        });
        out += '</div>';
      }

      if (evidence) out += '<div class="risk__ev">' + esc(evidence) + '</div>';
      if (stat) out += renderStatCards(stat);
      out += '</div>';
      return out;
    }

    // 国籍筛选:默认全部。标签页点选后隐藏不匹配的比赛卡,并隐藏因此变空的日期段
    var FILTER = 'all';
    function applyFilter(scope) {
      FILTER = scope;
      document.querySelectorAll('.match').forEach(function (el) {
        var show = scope === 'all' ||
          (scope === 'cn' && el.dataset.cn) ||
          (scope === 'jpkr' && el.dataset.jpkr);
        el.style.display = show ? '' : 'none';
      });
      document.querySelectorAll('.day').forEach(function (sec) {
        var anyVisible = false;
        sec.querySelectorAll('.match').forEach(function (m) { if (m.style.display !== 'none') anyVisible = true; });
        var hasStatic = sec.querySelector('.day__pending, .day__broadcast');
        sec.style.display = (anyVisible || hasStatic) ? '' : 'none';
      });
    }
    document.getElementById('filter').addEventListener('click', function (e) {
      var btn = e.target.closest('.filter__btn');
      if (!btn) return;
      document.querySelectorAll('.filter__btn').forEach(function (b) { b.classList.remove('is-active'); });
      btn.classList.add('is-active');
      applyFilter(btn.dataset.scope);
      // 切换 tab 时回到页面最顶上,避免停在原滚动位置
      window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    });

    function render(data) {
      document.title = data.title + ' · 每日更新';
      document.getElementById('updatedAt').textContent = data.updatedAt;

      var today = new Date();
      today.setHours(0, 0, 0, 0);

      // 拆分:今天及以后排前面(升序),昨天及更早移到末尾(降序,最近的在前)做战报回顾
      var daysAll = (data.days || []).map(function (day) {
        var d = new Date(day.date + 'T00:00:00');
        d.setHours(0, 0, 0, 0);
        return { day: day, diff: Math.round((d - today) / 86400000) };
      });
      var upcoming = daysAll.filter(function (x) { return x.diff >= 0; })
                            .sort(function (a, b) { return a.diff - b.diff; });
      var past = daysAll.filter(function (x) { return x.diff < 0; })
                        .sort(function (a, b) { return b.diff - a.diff; });
      var ordered = upcoming.concat(past);

      var html = '';
      var recapInjected = false;
      ordered.forEach(function (x) {
        var day = x.day, diff = x.diff;
        var rel = '', tagClass = 'tag--soon', dayClass = '';
        if (diff === 0) { rel = '今天'; tagClass = 'tag--today'; dayClass = ' day--today'; }
        else if (diff === 1) { rel = '明天'; }
        else if (diff === 2) { rel = '后天'; }
        else if (diff === -1) { rel = '昨日战报'; tagClass = 'tag--past'; dayClass = ' day--past'; }
        else if (diff < -1) { rel = '已结束'; tagClass = 'tag--past'; dayClass = ' day--past'; }

        // 进入回顾区时,只在首个过去日期前注入一次分隔标题
        if (diff < 0 && !recapInjected) {
          var recapLabel = (past.length === 1 && past[0].diff === -1) ? '昨日战报' : '往期战报';
          html += '<div class="recap-sep"><span>—— ' + recapLabel + ' ——</span></div>';
          recapInjected = true;
        }

        html += '<section class="day' + dayClass + '">';
        html += '<div class="day__head">' +
                  '<div class="day__when">' +
                    '<span class="day__date">' + esc(day.date) + '</span>' +
                    '<span class="day__week">' + esc(day.weekday) + '</span>' +
                  '</div>' +
                  '<div class="day__tags">' +
                    (rel ? '<span class="tag ' + tagClass + '">' + esc(rel) + '</span>' : '') +
                    '<span class="tag tag--muted">' + (day.matches.length ? day.matches.length + ' 场' : '待公布') + '</span>' +
                  '</div>' +
                '</div>';

        if (day.matches.length) {
          // 已完成(有 result)的比赛排到当日最后面;未完成的按时间升序在前
          var matches = day.matches.slice().sort(function (a, b) {
            var ad = a.result ? 1 : 0, bd = b.result ? 1 : 0;
            if (ad !== bd) return ad - bd;
            return (a.time || '').localeCompare(b.time || '');
          });
          // 首个「已结束」比赛之前插一条分隔,让「当日最后面」一眼可见
          var firstDone = -1;
          for (var mi = 0; mi < matches.length; mi++) { if (matches[mi].result) { firstDone = mi; break; } }
          var sepNeeded = firstDone > 0;
          matches.forEach(function (m, mi) {
            if (mi === firstDone && sepNeeded) {
              html += '<div class="match-sep"><span>已结束</span></div>';
            }
            var hasCN = m.nationHome === '中国' || m.nationAway === '中国';
            var hasJP = m.nationHome === '日本' || m.nationAway === '日本';
            var hasKR = m.nationHome === '韩国' || m.nationAway === '韩国';
            var scopeAttr = (hasCN ? ' data-cn="1"' : '') +
                            ((hasJP || hasKR) ? ' data-jpkr="1"' : '');
            html += '<article class="match"' + scopeAttr + '">';
            var eventLabel = (m.tournament ? '🏆 ' + esc(m.tournament) : '') +
                             (m.tournament && m.stage ? ' · ' : '') +
                             (m.stage ? esc(m.stage) : '');
            if (eventLabel) html += '<div class="match__event">' + eventLabel + '</div>';
            html += '<div class="match__bar">' +
                      '<span class="match__time">' + esc(m.time) + '</span>' +
                      '<span class="match__chan">' + esc(m.channel) + '</span>' +
                    '</div>';
            var homeInfo = ordinalizeInfo(m.playerHomeInfo);
            var awayInfo = ordinalizeInfo(m.playerAwayInfo);
            html += '<div class="match__players">' +
                      '<div class="player player--home">' +
                        '<span class="player__flag">' + flagFor(m.nationHome) + '</span>' +
                        '<span class="player__name">' + esc(m.playerHome) + '</span>' +
                        '<span class="player__meta">' + homeInfo + '</span>' +
                      '</div>' +
                      '<span class="player__vs">VS</span>' +
                      '<div class="player player--away">' +
                        '<span class="player__flag">' + flagFor(m.nationAway) + '</span>' +
                        '<span class="player__name">' + esc(m.playerAway) + '</span>' +
                        '<span class="player__meta">' + awayInfo + '</span>' +
                      '</div>' +
                    '</div>';
            if (m.result) {
              html += renderResult(m);
              if (m.summary) {
                html += '<div class="match__note note--summary">' +
                          '<div class="note__head">📝 比赛总结</div>' +
                          '<div class="note__body">' + esc(m.summary) + '</div>' +
                        '</div>';
              }
            } else if (m.live) {
              // 进行中:红色横幅 + 当前比分表;转播风险仍提示(电视看不全等)
              html += renderLive(m);
              if (m.risk) html += renderRisk(m.risk);
            } else {
              if (m.risk) html += renderRisk(m.risk);
              if (m.watchpoint) {
                html += '<div class="match__note note--watch">' +
                          '<div class="note__head">👀 看点</div>' +
                          '<div class="note__body">' + esc(m.watchpoint) + '</div>' +
                        '</div>';
              }
            }
            html += '</article>';
          });
        } else {
          // 只保留「乒乓球」直播窗口:剔除录像/录播,以及篮球/网球/田径/斯诺克/体育新闻等非乒乓球栏目
          var liveSchedule = (day.schedule || []).filter(function (s) {
            var txt = ((s.tournament || '') + ' ' + (s.content || '')).toLowerCase();
            if (txt.indexOf('录像') !== -1 || txt.indexOf('录播') !== -1) return false;
            var tt = ['乒乓','wtt','世乒','冠军赛','大满贯','世界杯','锦标','单打','双打','团体','混双','男单','女单','男双','女双','决赛'];
            return tt.some(function (k) { return txt.indexOf(k) !== -1; });
          });

          html += '<div class="day__pending">' +
                    '<div class="pending__head">📋 对阵待公布</div>' +
                    '<div class="pending__note">以下为国乒比赛可能落地的央视直播窗口<br>官方对阵表公布后自动替换为具体比赛</div>' +
                  '</div>';

          if (liveSchedule.length) {
            html += '<div class="sched">';
            liveSchedule.forEach(function (s) {
              var tp = (s.time || '').split('-');
              var timeHtml = '<span class="sched__time-start">' + esc(tp[0] || '') + '</span>' +
                             (tp[1] ? '<span class="sched__time-end">' + esc(tp[1]) + '</span>' : '');
              html += '<div class="sched__row">' +
                        '<span class="sched__time">' + timeHtml + '</span>' +
                        '<div class="sched__main">' +
                          '<span class="sched__chan">' + esc(s.channel) + '</span>' +
                          renderScheduleContent(s) +
                        '</div>' +
                      '</div>';
            });
            html += '</div>';
          } else {
            html += '<div class="sched__empty">暂无已确认的直播窗口,请稍后再来查看。</div>';
          }
        }

        if (day.broadcast) html += '<div class="day__broadcast"><b>📺 转播安排:</b> ' + esc(day.broadcast) + '</div>';
        html += '</section>';
      });

      if (data.nextEvent) {
        html += '<section class="day day--next">' +
                  '<div class="day__head">' +
                    '<div class="day__when">' +
                      '<span class="day__date">' + esc(data.nextEvent.date) + '</span>' +
                      '<span class="day__week">' + esc(data.nextEvent.weekday) + '</span>' +
                    '</div>' +
                    '<span class="tag tag--soon">距今天 ' + esc(data.nextEvent.daysAway) + ' 天</span>' +
                  '</div>' +
                  '<div class="day__next">下一场国乒比赛 · <strong>' + esc(data.nextEvent.note || '具体赛程待官方公布') + '</strong></div>' +
                '</section>';
      }

      document.getElementById('days').innerHTML = html;
      applyFilter(FILTER);
    }
  </script>
</body>
</html>
