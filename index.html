<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>国乒赛事日历 · 每日更新</title>
  <meta name="description" content="央视直播的国乒乒乓球比赛时间表,每日自动更新,大字大按钮,老年朋友也能看清。">
  <style>
    /* ========== 适老化设计:大字号 · 高对比 · 大触控 · 无动效 ========== */
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --text-sub: #4a4a4a;
      --accent: #1a5276;
      --accent-bg: #eaf2f8;
      --border: #c8c8c8;
      --warn: #b30000;
      --warn-bg: #fff3f3;
      --ok: #0e6b34;
      --ok-bg: #eefaf2;
      --chip-bg: #f0f0f0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { font-size: 18px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-text-size-adjust: 100%;
      padding: 0 0 calc(env(safe-area-inset-bottom) + 2rem) 0;
    }

    /* 页面容器:手机竖屏友好,桌面也不至于太宽 */
    .container { max-width: 720px; margin: 0 auto; padding: 1.2rem 1rem; }

    /* ---------- 页头 ---------- */
    header { text-align: center; padding: 1.8rem 1rem 1.4rem; border-bottom: 3px solid var(--text); }
    .title { font-size: 2.1rem; font-weight: 800; letter-spacing: 0.02em; }
    .subtitle { font-size: 1.15rem; color: var(--text-sub); margin-top: 0.4rem; }
    .updated { font-size: 1.05rem; color: var(--text-sub); margin-top: 0.6rem; }
    .updated strong { color: var(--accent); font-weight: 700; }

    /* ---------- 说明条 ---------- */
    .note {
      margin: 1.2rem 0;
      padding: 0.9rem 1rem;
      background: var(--accent-bg);
      border-left: 6px solid var(--accent);
      font-size: 1.05rem;
      color: var(--text);
      border-radius: 0.4rem;
    }

    /* ---------- 日期区块 ---------- */
    .day {
      border: 2px solid var(--border);
      border-radius: 0.8rem;
      margin: 1.6rem 0;
      overflow: hidden;
    }
    .day-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 1rem 1.1rem 0.8rem;
      background: var(--chip-bg);
      border-bottom: 2px solid var(--border);
    }
    .day-date { font-size: 1.5rem; font-weight: 800; }
    .day-weekday { font-size: 1.15rem; color: var(--text-sub); margin-left: 0.6rem; }
    .day-badge { font-size: 1.05rem; font-weight: 700; color: var(--accent); }

    /* ---------- 比赛卡片 ---------- */
    .match {
      padding: 1rem 1.1rem;
      border-bottom: 1px solid var(--border);
    }
    .match:last-child { border-bottom: none; }
    .match-top { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; }
    .match-time { font-size: 1.7rem; font-weight: 800; color: var(--accent); white-space: nowrap; }
    .match-channel {
      font-size: 1.05rem; font-weight: 700;
      background: var(--text); color: var(--bg);
      padding: 0.3rem 0.9rem; border-radius: 2rem;
      white-space: nowrap;
    }
    .match-players { margin-top: 0.6rem; font-size: 1.25rem; font-weight: 700; line-height: 1.5; }
    .match-players .info { font-size: 1rem; color: var(--text-sub); font-weight: 400; margin-left: 0.4rem; }
    .match-stage { margin-top: 0.3rem; font-size: 1.05rem; color: var(--text-sub); }
    .match-risk {
      margin-top: 0.7rem; font-size: 1.05rem; line-height: 1.6;
      background: var(--warn-bg); color: var(--warn);
      border: 1px solid #e0a0a0; border-radius: 0.4rem;
      padding: 0.55rem 0.8rem;
    }
    .match-sources { margin-top: 0.6rem; font-size: 0.95rem; color: var(--text-sub); }
    .match-sources .tag {
      display: inline-block; background: var(--ok-bg); color: var(--ok);
      border: 1px solid #7ec49a; border-radius: 2rem;
      padding: 0.15rem 0.7rem; font-weight: 700; margin-right: 0.4rem;
    }

    /* ---------- 待公布 ---------- */
    .pending {
      padding: 1.2rem 1.1rem;
      font-size: 1.1rem;
      color: var(--text-sub);
    }
    .pending strong { color: var(--text); }

    /* ---------- 广播信息 ---------- */
    .broadcast {
      padding: 0.9rem 1.1rem 1rem;
      font-size: 1.0rem;
      color: var(--text-sub);
      border-top: 1px dashed var(--border);
      background: #fafafa;
    }
    .broadcast::before { content: "📺 转播安排:"; font-weight: 700; color: var(--text); }

    /* ---------- 页脚 ---------- */
    footer { margin-top: 2.2rem; text-align: center; font-size: 1rem; color: var(--text-sub); }
    footer .links { margin-top: 0.8rem; }
    footer a {
      display: inline-block; margin: 0.3rem;
      padding: 0.6rem 1.4rem;
      font-size: 1.05rem; font-weight: 700;
      color: var(--bg); background: var(--accent);
      text-decoration: none; border-radius: 2rem;
      min-height: 48px; line-height: 48px; /* 大触控区 */
    }
    footer a:active { opacity: 0.85; }
    footer a.secondary { background: var(--text-sub); }

    /* 加载失败提示 */
    .error {
      margin: 1.2rem 0; padding: 1.2rem 1rem;
      background: var(--warn-bg); color: var(--warn);
      border: 2px solid #e0a0a0; border-radius: 0.8rem;
      font-size: 1.1rem; text-align: center;
    }

    /* ---------- 大屏适配:字号再放大一档 ---------- */
    @media (min-width: 600px) {
      html { font-size: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">🏓 国乒赛事日历</div>
    <div class="subtitle">央视直播 · 国乒赛程 · 每日更新</div>
    <div class="updated">数据更新于 <strong id="updatedAt">…</strong></div>
  </header>

  <div class="container">
    <div class="note" id="note"></div>
    <div id="days"></div>
    <footer>
      <div>数据经 ≥4 个独立来源交叉认证,冲突取多数源时间,同稿转载不计独立源。</div>
      <div class="links">
        <a href="https://sports.cctv.com/" target="_blank" rel="noopener">央视体育官网</a>
        <a href="https://www.tvmao.com/" target="_blank" rel="noopener" class="secondary">电视猫节目单</a>
      </div>
    </footer>
  </div>

  <script>
    // 适老化:纯文本渲染,无动画、无复杂交互,保证任何设备可读
    fetch('data.json')
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(render)
      .catch(function (err) {
        document.getElementById('updatedAt').textContent = '加载失败';
        document.getElementById('days').innerHTML =
          '<div class="error">数据加载失败(' + err.message + ')<br>请稍后刷新,或稍后再来访问。</div>';
      });

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function render(data) {
      document.title = data.title + ' · 每日更新';
      document.getElementById('updatedAt').textContent = data.updatedAt;
      document.getElementById('note').textContent = data.note;

      var html = '';
      data.days.forEach(function (day) {
        html += '<section class="day">';
        html += '<div class="day-header">' +
                  '<div><span class="day-date">' + esc(day.date) + '</span>' +
                  '<span class="day-weekday">' + esc(day.weekday) + '</span></div>' +
                  '<span class="day-badge">' + (day.matches.length ? day.matches.length + ' 场' : '待公布') + '</span>' +
                '</div>';

        if (day.matches.length) {
          day.matches.forEach(function (m) {
            html += '<div class="match">';
            html += '<div class="match-top">' +
                      '<span class="match-time">' + esc(m.time) + '</span>' +
                      '<span class="match-channel">' + esc(m.channel) + '</span>' +
                    '</div>';
            html += '<div class="match-players">' + esc(m.playerHome) + '<span class="info">' + esc(m.playerHomeInfo) + '</span>' +
                    ' <span>vs</span> ' + esc(m.playerAway) + '<span class="info">' + esc(m.playerAwayInfo) + '</span></div>';
            html += '<div class="match-stage">' + esc(m.stage) + '</div>';
            if (m.risk) html += '<div class="match-risk">' + esc(m.risk) + '</div>';
            html += '<div class="match-sources"><span class="tag">✅ ' + esc(m.sources) + ' 源认证</span>时间经多源交叉验证</div>';
            html += '</div>';
          });
        } else {
          html += '<div class="pending"><strong>待节目单公布</strong> —— 国乒具体对阵待前一日赛果产生后更新,请明天再来查看。</div>';
        }

        if (day.broadcast) html += '<div class="broadcast">' + esc(day.broadcast) + '</div>';
        html += '</section>';
      });

      document.getElementById('days').innerHTML = html;
    }
  </script>
</body>
</html>
