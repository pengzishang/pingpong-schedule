<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>国乒赛事日历 · 每日更新</title>
  <meta name="description" content="央视直播的国乒乒乓球比赛时间表,每日自动更新,大字大按钮,老年朋友也能看清。">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    /* ========== 适老化设计:大字号 · 高对比 · 大触控 · 无动效 ========== */
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --text-sub: #4a4a4a;
      --accent: #1a5276;
      --accent-bg: #eaf2f8;
      --border: #c8c8c8;
      --warn: #b30000;
      --warn-bg: #fff3f3;
      --ok: #0e6b34;
      --ok-bg: #eefaf2;
      --chip-bg: #f0f0f0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { font-size: 18px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-text-size-adjust: 100%;
      padding: 0 0 calc(env(safe-area-inset-bottom) + 2rem) 0;
    }

    /* 页面容器:手机竖屏友好,桌面也不至于太宽 */
    .container { max-width: 720px; margin: 0 auto; padding: 1.2rem 1rem; }

    /* ---------- 页头 ---------- */
    header { text-align: center; padding: 1.8rem 1rem 1.4rem; border-bottom: 3px solid var(--text); }
    .title { font-size: 2.1rem; font-weight: 800; letter-spacing: 0.02em; }
    .updated { font-size: 1.05rem; color: var(--text-sub); margin-top: 0.6rem; }
    .updated strong { color: var(--accent); font-weight: 700; }

    /* 实时时钟:大字号、等宽数字防跳动 */
    .clock {
      margin-top: 0.9rem;
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      line-height: 1.2;
    }
    .clock-date { font-size: 1.1rem; color: var(--text-sub); margin-top: 0.2rem; }

    /* 国旗 */
    .flag { font-size: 1.1em; margin: 0 0.2em; vertical-align: -0.05em; }

    /* ---------- 日期区块 ---------- */
    .day {
      border: 2px solid var(--border);
      border-radius: 0.8rem;
      margin: 1.6rem 0;
      overflow: hidden;
    }
    .day-header {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 1rem 1.1rem 0.8rem;
      background: var(--chip-bg);
      border-bottom: 2px solid var(--border);
      text-align: center;
    }
    .day-date { font-size: 1.5rem; font-weight: 800; }
    .day-weekday { font-size: 1.15rem; color: var(--text-sub); margin-left: 0.6rem; }
    .day-badge { font-size: 1.05rem; font-weight: 700; color: var(--accent); }
    .day-relative {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      background: var(--warn);
      padding: 0.15rem 0.7rem;
      border-radius: 2rem;
      margin-left: 0.4rem;
      white-space: nowrap;
    }

    /* ---------- 比赛卡片 ---------- */
    .match {
      padding: 1rem 1.1rem;
      border-bottom: 1px solid var(--border);
    }
    .match:last-child { border-bottom: none; }
    .match-top {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      min-height: 3rem;
      gap: 0.8rem;
    }
    .match-time {
      grid-column: 2;
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--accent);
      white-space: nowrap;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .match-channel {
      grid-column: 3;
      justify-self: end;
      font-size: 1.05rem; font-weight: 700;
      background: var(--text); color: var(--bg);
      padding: 0.3rem 0.9rem; border-radius: 2rem;
      white-space: nowrap;
    }
    /* 赛事名 + 轮次合并为一条居中标签 */
    .match-event {
      margin: 0.5rem auto 0;
      display: block;
      width: fit-content;
      max-width: 100%;
      font-size: 1.05rem; font-weight: 700;
      color: var(--accent);
      background: var(--accent-bg);
      border: 1px solid #9dbdd4;
      padding: 0.3rem 0.9rem;
      border-radius: 2rem;
      text-align: center;
    }
    .match-players {
      margin-top: 0.7rem;
      font-size: 1.4rem; font-weight: 800;
      line-height: 1.5;
      text-align: center;               /* 对阵居中突出 */
    }
    .match-players .vs { color: var(--text-sub); font-weight: 700; margin: 0 0.3rem; }
    .match-players .info { font-size: 1rem; color: var(--text-sub); font-weight: 400; margin-left: 0.4rem; }
    .match-result {
      margin-top: 0.7rem; font-size: 1.15rem; font-weight: 700;
      text-align: center; color: var(--text);
      background: var(--ok-bg); border: 1px solid #7ec49a;
      border-radius: 0.4rem; padding: 0.5rem 0.8rem;
    }
    .match-risk {
      margin-top: 0.7rem; font-size: 1.05rem; line-height: 1.6;
      background: var(--warn-bg); color: var(--warn);
      border: 1px solid #e0a0a0; border-radius: 0.4rem;
      padding: 0.55rem 0.8rem;
    }

    /* ---------- 待公布 / 转播安排 ---------- */
    .pending {
      padding: 1.2rem 1.1rem 0.8rem;
      font-size: 1.1rem;
      color: var(--text-sub);
    }
    .pending strong { color: var(--text); }

    .sched-title {
      padding: 0.6rem 1.1rem 0.4rem;
      font-size: 1.1rem; font-weight: 800; color: var(--accent);
    }
    .sched-item {
      padding: 0.85rem 1.1rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.8rem;
    }
    .sched-item:last-child { border-bottom: none; }
    .sched-time { font-size: 1.5rem; font-weight: 800; color: var(--accent); white-space: nowrap; }
    .sched-info { text-align: right; }
    .sched-channel {
      display: inline-block; font-size: 1.0rem; font-weight: 700;
      background: var(--text); color: var(--bg);
      padding: 0.25rem 0.8rem; border-radius: 2rem;
    }
    .sched-content { font-size: 1.05rem; color: var(--text); margin-top: 0.3rem; }

    /* ---------- 广播信息 ---------- */
    .broadcast {
      padding: 0.9rem 1.1rem 1rem;
      font-size: 1.0rem;
      color: var(--text-sub);
      border-top: 1px dashed var(--border);
      background: #fafafa;
    }
    .broadcast::before { content: "📺 转播安排:"; font-weight: 700; color: var(--text); }

    /* ---------- 空窗期:下一场比赛 ---------- */
    .next-event-day { border-color: var(--accent); }
    .next-event-body {
      padding: 1.3rem 1.1rem;
      font-size: 1.25rem; font-weight: 700;
      text-align: center; color: var(--text);
    }

    /* ---------- 页脚 ---------- */
    footer { margin-top: 2.2rem; text-align: center; font-size: 1rem; color: var(--text-sub); }
    footer .links { margin-top: 0.8rem; }
    footer a {
      display: inline-block; margin: 0.3rem;
      padding: 0.6rem 1.4rem;
      font-size: 1.05rem; font-weight: 700;
      color: var(--bg); background: var(--accent);
      text-decoration: none; border-radius: 2rem;
      min-height: 48px; line-height: 48px; /* 大触控区 */
    }
    footer a:active { opacity: 0.85; }
    footer a.secondary { background: var(--text-sub); }

    /* 加载失败提示 */
    .error {
      margin: 1.2rem 0; padding: 1.2rem 1rem;
      background: var(--warn-bg); color: var(--warn);
      border: 2px solid #e0a0a0; border-radius: 0.8rem;
      font-size: 1.1rem; text-align: center;
    }

    /* ---------- 大屏适配:字号再放大一档 ---------- */
    @media (min-width: 600px) {
      html { font-size: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">🏓 国乒赛事日历</div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="clock-date" id="clockDate">…</div>
    <div class="updated">数据更新于 <strong id="updatedAt">…</strong></div>
  </header>

  <div class="container">
    <div id="days"></div>
    <footer>
      <div class="links">
        <a href="https://sports.cctv.com/" target="_blank" rel="noopener">央视体育官网</a>
        <a href="https://www.tvmao.com/" target="_blank" rel="noopener" class="secondary">电视猫节目单</a>
      </div>
    </footer>
  </div>

  <script>
    // 适老化:纯文本渲染,无动画、无复杂交互,保证任何设备可读

    // ---- 实时时钟(北京时间,每秒跳动) ----
    function tick() {
      var now = new Date();
      var hh = String(now.getHours()).padStart(2, '0');
      var mm = String(now.getMinutes()).padStart(2, '0');
      var ss = String(now.getSeconds()).padStart(2, '0');
      var el = document.getElementById('clock');
      if (el) el.textContent = hh + ':' + mm + ':' + ss;
      var de = document.getElementById('clockDate');
      if (de) de.textContent = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' +
        '星期' + '日一二三四五六'.charAt(now.getDay());
    }
    tick();
    setInterval(tick, 1000);

    // ---- 国旗映射(国籍 → 国旗 emoji) ----
    var FLAGS = {
      '中国': '🇨🇳', '中国香港': '🇭🇰', '中国台北': '🇨🇳',
      '日本': '🇯🇵', '韩国': '🇰🇷', '朝鲜': '🇰🇵',
      '法国': '🇫🇷', '德国': '🇩🇪', '英国': '🇬🇧', '瑞典': '🇸🇪',
      '俄罗斯': '🇷🇺', '葡萄牙': '🇵🇹', '丹麦': '🇩🇰',
      '美国': '🇺🇸', '澳大利亚': '🇦🇺', '新加坡': '🇸🇬',
      '印度': '🇮🇳', '埃及': '🇪🇬', '罗马尼亚': '🇷🇴', '波兰': '🇵🇱'
    };
    function flagFor(nation) {
      if (!nation) return '';
      for (var key in FLAGS) {
        if (nation.indexOf(key) !== -1) return FLAGS[key];
      }
      return '';
    }

    // 加时间戳 + no-store,绕开 GitHub Pages 的 max-age=600 缓存,保证每次打开都拿最新数据
    fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(render)
      .catch(function (err) {
        document.getElementById('updatedAt').textContent = '加载失败';
        document.getElementById('days').innerHTML =
          '<div class="error">数据加载失败(' + err.message + ')<br>请稍后刷新,或稍后再来访问。</div>';
      });

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function relativeLabel(dateStr) {
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      var d = new Date(dateStr + 'T00:00:00');
      d.setHours(0, 0, 0, 0);
      var diff = Math.round((d - today) / (1000 * 60 * 60 * 24));
      if (diff === 0) return '今天';
      if (diff === 1) return '明天';
      if (diff === 2) return '后天';
      return '';
    }

    function ordinal(n) {
      var s = ['th', 'st', 'nd', 'rd'];
      var v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    function ordinalizeInfo(info) {
      if (!info) return '';
      return esc(info).replace(/世界第(\d+)/g, function (_, n) { return ordinal(parseInt(n, 10)) + ''; });
    }

    function render(data) {
      document.title = data.title + ' · 每日更新';
      document.getElementById('updatedAt').textContent = data.updatedAt;

      // 只显示今天及以后的日期,昨天及更早的数据自动隐藏
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      var html = '';
      (data.days || []).filter(function (day) {
        var d = new Date(day.date + 'T00:00:00');
        return d >= today;
      }).forEach(function (day) {
        var rel = relativeLabel(day.date);
        html += '<section class="day">';
        html += '<div class="day-header">' +
                  '<span class="day-date">' + esc(day.date) + '</span>' +
                  '<span class="day-weekday">' + esc(day.weekday) + '</span>' +
                  (rel ? '<span class="day-relative">' + esc(rel) + '</span>' : '') +
                  '<span class="day-badge">' + (day.matches.length ? day.matches.length + ' 场' : '待公布') + '</span>' +
                '</div>';

        if (day.matches.length) {
          day.matches.forEach(function (m) {
            html += '<div class="match">';
            html += '<div class="match-top">' +
                      '<span class="match-time">' + esc(m.time) + '</span>' +
                      '<span class="match-channel">' + esc(m.channel) + '</span>' +
                    '</div>';
            var homeInfo = ordinalizeInfo(m.playerHomeInfo);
            var awayInfo = ordinalizeInfo(m.playerAwayInfo);
            var eventLabel = (m.tournament ? '🏆 ' + esc(m.tournament) : '') +
                             (m.tournament && m.stage ? ' · ' : '') +
                             (m.stage ? esc(m.stage) : '');
            if (eventLabel) html += '<div class="match-event">' + eventLabel + '</div>';
            html += '<div class="match-players">' +
                    '<span class="flag">' + flagFor(m.nationHome) + '</span>' + esc(m.playerHome) + '<span class="info">' + homeInfo + '</span>' +
                    ' <span class="vs">VS</span> ' +
                    '<span class="flag">' + flagFor(m.nationAway) + '</span>' + esc(m.playerAway) + '<span class="info">' + awayInfo + '</span></div>';
            if (m.result) {
              html += '<div class="match-result">' + esc(m.result) + '</div>';
            } else if (m.risk) {
              html += '<div class="match-risk">' + esc(m.risk) + '</div>';
            }
            html += '</div>';
          });
        } else {
          html += '<div class="pending"><strong>国乒对阵待节目单公布</strong> —— 以下为央视今日已排定的转播安排:</div>';
          if (day.schedule && day.schedule.length) {
            html += '<div class="sched-title">📺 央视转播安排</div>';
            day.schedule.forEach(function (s) {
              html += '<div class="sched-item">' +
                        '<span class="sched-time">' + esc(s.time) + '</span>' +
                        '<span class="sched-info"><span class="sched-channel">' + esc(s.channel) + '</span>' +
                        '<div class="sched-content">' + (s.tournament ? '🏆 ' + esc(s.tournament) + ' · ' : '') + esc(s.content) + '</div></span>' +
                      '</div>';
            });
          } else {
            html += '<div class="pending">暂无转播安排,请明天再来查看。</div>';
          }
        }

        if (day.broadcast) html += '<div class="broadcast">' + esc(day.broadcast) + '</div>';
        html += '</section>';
      });

      if (data.nextEvent) {
        html += '<section class="day next-event-day">' +
                  '<div class="day-header">' +
                    '<span class="day-date">' + esc(data.nextEvent.date) + '</span>' +
                    '<span class="day-weekday">' + esc(data.nextEvent.weekday) + '</span>' +
                    '<span class="day-relative">距今天 ' + esc(data.nextEvent.daysAway) + ' 天</span>' +
                  '</div>' +
                  '<div class="next-event-body"><strong>下一场国乒比赛</strong> —— ' + esc(data.nextEvent.note || '具体赛程待官方公布') + '</div>' +
                '</section>';
      }

      document.getElementById('days').innerHTML = html;
    }
  </script>
</body>
</html>
